# secrets.yaml for adminportal. This file is generated as a template to aid in
# deploying the necessary secrets.
#
# COMMITTING THIS FILE IS STRONGLY DISCOURAGED. Instead, it is recommended that you
# fill it out manually for now and deploy the secrets out of band, or use
# a solution like [sealed secrets](https://github.com/bitnami-labs/sealed-secrets)
# to manage this information.
---
apiVersion: v1
kind: Secret
metadata:
  name: adminportal
  labels:
    app: adminportal
stringData:
  # Jackson settings - Cloud PostgreSQL
  DB_URL: "<DB_URL>"
  SAML_AUDIENCE: ""
  JACKSON_API_KEYS: "secret"
  DB_TYPE: ""
  DB_TTL: ""
  DB_CLEANUP_LIMIT: ""
  DB_ENCRYPTION_KEY: ""
  SMTP_HOST: ""
  SMTP_PORT: ""
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: ""
  NEXTAUTH_JWT_SIGNING_PRIVATE_KEY: ""
  NEXTAUTH_URL: "<NEXTAUTH_URL>"
  NEXTAUTH_SECRET: "secret"
  NEXTAUTH_ACL: ""
  NEXTAUTH_ADMIN_CREDENTIALS: "<email>:<password>"
  BOXYHQ_NO_ANALYTICS: "1"
  RETRACED_HOST_URL: "<RETRACED_HOST_URL>"
  RETRACED_EXTERNAL_URL: "<RETRACED_EXTERNAL_URL>"
  RETRACED_ADMIN_ROOT_TOKEN: "dev"
  BOXYHQ_LICENSE_KEY: ""
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
